<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe 3D Avatar</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="container">
    <div id="preview-container">
      <video id="screen-background" autoplay playsinline muted></video>
      <div id="camera-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="debug_canvas"></canvas>
      </div>
      <div id="scene-wrapper">
        <canvas id="output_canvas"></canvas>
      </div>
      <!-- Blackout Overlay -->
      <div id="blackout-overlay"></div>
      <!-- Drawing Canvas (topmost, receives pointer events in draw mode) -->
      <canvas id="drawing-canvas"></canvas>
      <!-- Drawing Toolbar -->
      <div id="drawing-toolbar">
        <!-- Handle: drag grip + orientation toggle -->
        <div id="drawing-toolbar-handle">
          <svg class="draw-grip" viewBox="0 0 12 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/>
            <circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/>
            <circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/>
          </svg>
          <button id="draw-orient-btn" title="Toggle layout orientation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5"/>
              <path id="draw-orient-path" d="M12 3v18"/>
            </svg>
          </button>
        </div>
        <!-- Row 1: tools · colors · sizes · actions -->
        <div id="drawing-toolbar-row1">
          <button class="draw-tool-btn active" data-tool="pen" title="Pen (P)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
          </button>
          <button class="draw-tool-btn" data-tool="highlighter" title="Highlighter (H)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 2-3.5-3.5-9 9 3.5 3.5 9-9z"/></svg>
          </button>
          <button class="draw-tool-btn" data-tool="arrow" title="Arrow (A)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
          </button>
          <button class="draw-tool-btn" data-tool="text" title="Text (T)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          </button>
          <button class="draw-tool-btn" data-tool="eraser" title="Eraser (E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          </button>
          <span class="draw-divider"></span>
          <div class="draw-colors-grid">
            <button class="draw-color-btn" data-color="#ff3b30" style="background:#ff3b30" title="Red"></button>
            <button class="draw-color-btn" data-color="#ffcc00" style="background:#ffcc00" title="Yellow"></button>
            <button class="draw-color-btn" data-color="#34c759" style="background:#34c759" title="Green"></button>
            <button class="draw-color-btn active" data-color="#007aff" style="background:#007aff" title="Blue"></button>
            <button class="draw-color-btn" data-color="#ffffff" style="background:#ffffff" title="White"></button>
            <button class="draw-color-btn" data-color="#000000" style="background:#000000" title="Black"></button>
          </div>
          <span class="draw-divider"></span>
          <div class="draw-sizes-row">
            <button class="draw-size-btn" data-size="S" title="Small stroke">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
            </button>
            <button class="draw-size-btn active" data-size="M" title="Medium stroke">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
            </button>
            <button class="draw-size-btn" data-size="L" title="Large stroke">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="draw-fontsize-presets">
            <button class="draw-fontsize-btn" data-fontsize="16" title="Small (16px)">S</button>
            <button class="draw-fontsize-btn active" data-fontsize="24" title="Medium (24px)">M</button>
            <button class="draw-fontsize-btn" data-fontsize="36" title="Large (36px)">L</button>
          </div>
          <span class="draw-divider"></span>
          <button id="draw-fade-btn" title="Fade annotations (auto-disappear)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
          <button id="draw-blackout-btn" title="Blackout background (B)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3C7.03 3 3 7.03 3 12s4.03 9 9 9z" fill="currentColor" stroke="none"/></svg>
          </button>
          <span class="draw-divider"></span>
          <button id="draw-undo-btn" title="Undo (Cmd/Ctrl+Z)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          </button>
          <button id="draw-clear-btn" title="Clear all (C)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
        <!-- Row separator: visible in horizontal mode when text tool active -->
        <span class="draw-row-sep"></span>
        <!-- Row 2: text-specific controls (shadow/bg · font size) -->
        <div id="drawing-toolbar-row2">
          <div class="draw-textstyle-row">
            <button class="draw-textstyle-btn active" data-textstyle="shadow" title="Text shadow">
              <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <text x="11.5" y="15.5" text-anchor="middle" font-size="12" font-weight="800" fill="rgba(0,0,0,0.45)" font-family="system-ui,sans-serif">T</text>
                <text x="9.5" y="13.5" text-anchor="middle" font-size="12" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">T</text>
              </svg>
            </button>
            <button class="draw-textstyle-btn" data-textstyle="background" title="Text background">
              <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <rect x="1.5" y="5" width="17" height="11" rx="2.5" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
                <text x="10" y="14.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">T</text>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- Screen Zoom Indicator -->
      <div id="screen-zoom-indicator">1.0×</div>
      <!-- Dialogue Overlay (unified chat/caption) -->
      <div id="dialogue-overlay">
        <div id="dialogue-messages"></div>
      </div>
      <div id="dialogue-input-container">
        <input type="text" id="dialogue-input" placeholder="Type a message... (Enter to send)" autocomplete="off">
        <button id="clear-dialogue" title="Clear all messages">✕</button>
      </div>
    </div>
    <div id="controls">
      <!-- Screen/Recording 제어 -->
      <button id="toggle-record">Start<br>Record</button>
      <button id="toggle-screen">Screen<br>Capture</button>
      <button id="toggle-draw">Draw<br>OFF</button>
      <span class="divider">|</span>
      <!-- 장치 제어 (Camera, Mic) -->
      <button id="toggle-camera">Cam<br>ON</button>
      <button id="toggle-mic">Mic<br>OFF</button>
      <div class="audio-controls">
        <div class="audio-meters">
          <div class="audio-meter" id="mic-meter" title="Microphone Level">
            <div class="audio-meter-bar"></div>
          </div>
          <div class="audio-meter" id="tab-meter" title="Tab Audio Level">
            <div class="audio-meter-bar"></div>
          </div>
        </div>
        <div class="audio-mix-row">
          <!-- 마이크 아이콘 (왼쪽 = Mic 비중 높음) -->
          <svg class="mix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Microphone">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="17" x2="12" y2="22"/>
            <line x1="9" y1="22" x2="15" y2="22"/>
          </svg>
          <input type="range" id="audio-mix-slider" min="0" max="100" value="50" title="Mic ← → Tab">
          <!-- 모니터 아이콘 (오른쪽 = Tab 오디오 비중 높음) -->
          <svg class="mix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Tab Audio">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
      </div>
      <span class="divider">|</span>
      <!-- 아바타 제어 -->
      <div class="avatar-controls">
        <button id="toggle-avatar-visibility">Avatar<br>ON</button>
        <div class="avatar-options">
          <div class="option-group">
            <span class="option-label">Size</span>
            <button class="option-btn active" data-avatar-size="full">Full</button>
            <button class="option-btn" data-avatar-size="mini">Mini</button>
          </div>
          <div class="option-group">
            <span class="option-label">Pose</span>
            <button class="option-btn" data-avatar-pose="on">ON</button>
            <button class="option-btn active" data-avatar-pose="off">OFF</button>
            <span class="beta-badge">beta</span>
          </div>
          <div class="option-group">
            <span class="option-label">View</span>
            <button class="option-btn active" id="orbit-controls-off">OFF</button>
            <button class="option-btn" id="orbit-controls-on">ON</button>
          </div>
          <div class="option-group">
            <select id="avatar-select-dropdown" title="아바타 선택">
              <option value="./avatar.vrm">♀ Female</option>
              <option value="./avatar-male.glb">♂ Male</option>
            </select>
          </div>
          <div class="option-group">
            <button id="load-custom-avatar" title="로컬 VRM 파일 불러오기">Load VRM</button>
            <input type="file" id="avatar-file-input" accept=".vrm,.glb" style="display:none">
          </div>
        </div>
      </div>
      <div class="dialogue-controls">
        <button id="toggle-dialogue">Talk<br>OFF</button>
        <div class="dialogue-options">
          <div class="option-group">
            <span class="option-label">Display</span>
            <button class="option-btn" data-display="history">History</button>
            <button class="option-btn active" data-display="single">Single</button>
          </div>
          <div class="option-group">
            <span class="option-label">Input</span>
            <button class="option-btn" data-input="typing">Typing</button>
            <button class="option-btn active" data-input="voice">Voice</button>
          </div>
        </div>
      </div>
      <span class="divider">|</span>
      <!-- 개발자용 -->
      <div class="dev-controls">
        <button id="toggle-dev">Dev</button>
        <div class="dev-options">
          <div class="option-group">
            <span class="option-label">Split</span>
            <button class="option-btn" data-dev="debug-off">OFF</button>
            <button class="option-btn active" data-dev="debug-on">ON</button>
          </div>
          <div class="option-group">
            <span class="option-label">Landmarks</span>
            <button class="option-btn active" data-dev="landmarks-off">OFF</button>
            <button class="option-btn" data-dev="landmarks-on">ON</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="avatar-anchor"></div>
  <script type="module" src="./main.js"></script>
</body>

</html>
