<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe 3D Avatar</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="container">
    <div id="preview-container">
      <video id="screen-background" autoplay playsinline muted></video>
      <div id="camera-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="debug_canvas"></canvas>
      </div>
      <div id="scene-wrapper">
        <canvas id="output_canvas"></canvas>
      </div>
      <!-- Blackout Overlay -->
      <div id="blackout-overlay"></div>
      <!-- Drawing Canvas (topmost, receives pointer events in draw mode) -->
      <canvas id="drawing-canvas"></canvas>
      <!-- Drawing Toolbar -->
      <div id="drawing-toolbar">
        <div id="drawing-toolbar-row1">
          <button class="draw-tool-btn active" data-tool="pen" title="Pen (P)">✏</button>
          <button class="draw-tool-btn" data-tool="highlighter" title="Highlighter (H)">══</button>
          <button class="draw-tool-btn" data-tool="arrow" title="Arrow (A)">→</button>
          <button class="draw-tool-btn" data-tool="text" title="Text (T)">T</button>
          <button class="draw-tool-btn" data-tool="eraser" title="Eraser (E)">◌</button>
          <span class="draw-divider">|</span>
          <button class="draw-color-btn active" data-color="#ff3b30" style="background:#ff3b30" title="Red"></button>
          <button class="draw-color-btn" data-color="#ffcc00" style="background:#ffcc00" title="Yellow"></button>
          <button class="draw-color-btn" data-color="#34c759" style="background:#34c759" title="Green"></button>
          <button class="draw-color-btn" data-color="#007aff" style="background:#007aff" title="Blue"></button>
          <button class="draw-color-btn" data-color="#ffffff" style="background:#ffffff" title="White"></button>
          <button class="draw-color-btn" data-color="#000000" style="background:#000000" title="Black"></button>
          <span class="draw-divider">|</span>
          <button class="draw-size-btn" data-size="S" title="Small">S</button>
          <button class="draw-size-btn active" data-size="M" title="Medium">M</button>
          <button class="draw-size-btn" data-size="L" title="Large">L</button>
          <span class="draw-divider">|</span>
          <button id="draw-fade-btn" title="Fade annotations">FADE</button>
          <button id="draw-blackout-btn" title="Blackout background (B)">BG</button>
          <span class="draw-divider">|</span>
          <button id="draw-undo-btn" title="Undo (Cmd/Ctrl+Z)">↩</button>
          <button id="draw-clear-btn" title="Clear all (C)">✕</button>
        </div>
        <div id="drawing-toolbar-row2">
          <button class="draw-textstyle-btn" data-textstyle="shadow" title="Shadow">Shadow</button>
          <button class="draw-textstyle-btn" data-textstyle="background" title="Background">BG</button>
          <span class="draw-divider">|</span>
          <button id="draw-font-decrease" title="Decrease font size">−</button>
          <span id="draw-font-size-label">24px</span>
          <button id="draw-font-increase" title="Increase font size">+</button>
        </div>
      </div>
      <!-- Screen Zoom Indicator -->
      <div id="screen-zoom-indicator">1.0×</div>
      <!-- Dialogue Overlay (unified chat/caption) -->
      <div id="dialogue-overlay">
        <div id="dialogue-messages"></div>
      </div>
      <div id="dialogue-input-container">
        <input type="text" id="dialogue-input" placeholder="Type a message... (Enter to send)" autocomplete="off">
        <button id="clear-dialogue" title="Clear all messages">✕</button>
      </div>
    </div>
    <div id="controls">
      <!-- Screen/Recording 제어 -->
      <button id="toggle-record">Start<br>Record</button>
      <button id="toggle-screen">Screen<br>Capture</button>
      <button id="toggle-draw" disabled>Draw<br>OFF</button>
      <span class="divider">|</span>
      <!-- 장치 제어 (Camera, Mic) -->
      <button id="toggle-camera">Cam<br>ON</button>
      <button id="toggle-mic">Mic<br>OFF</button>
      <div class="audio-controls">
        <div class="audio-meters">
          <div class="audio-meter" id="mic-meter" title="Microphone Level">
            <div class="audio-meter-bar"></div>
          </div>
          <div class="audio-meter" id="tab-meter" title="Tab Audio Level">
            <div class="audio-meter-bar"></div>
          </div>
        </div>
        <div class="audio-mix-row">
          <!-- 마이크 아이콘 (왼쪽 = Mic 비중 높음) -->
          <svg class="mix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Microphone">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <line x1="12" y1="17" x2="12" y2="22"/>
            <line x1="9" y1="22" x2="15" y2="22"/>
          </svg>
          <input type="range" id="audio-mix-slider" min="0" max="100" value="50" title="Mic ← → Tab">
          <!-- 모니터 아이콘 (오른쪽 = Tab 오디오 비중 높음) -->
          <svg class="mix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Tab Audio">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
      </div>
      <span class="divider">|</span>
      <!-- 아바타 제어 -->
      <div class="avatar-controls">
        <button id="toggle-avatar-visibility">Avatar<br>ON</button>
        <div class="avatar-options">
          <div class="option-group">
            <span class="option-label">Size</span>
            <button class="option-btn active" data-avatar-size="full">Full</button>
            <button class="option-btn" data-avatar-size="mini">Mini</button>
          </div>
          <div class="option-group">
            <span class="option-label">Pose</span>
            <button class="option-btn" data-avatar-pose="on">ON</button>
            <button class="option-btn active" data-avatar-pose="off">OFF</button>
          </div>
          <div class="option-group">
            <select id="avatar-select-dropdown" title="아바타 선택">
              <option value="./avatar.vrm">♀ Female</option>
              <option value="./avatar-male.glb">♂ Male</option>
            </select>
          </div>
          <div class="option-group">
            <button id="load-custom-avatar" title="로컬 VRM 파일 불러오기">Load VRM</button>
            <input type="file" id="avatar-file-input" accept=".vrm,.glb" style="display:none">
          </div>
        </div>
      </div>
      <div class="dialogue-controls">
        <button id="toggle-dialogue">Talk<br>OFF</button>
        <div class="dialogue-options">
          <div class="option-group">
            <span class="option-label">Display</span>
            <button class="option-btn" data-display="history">History</button>
            <button class="option-btn active" data-display="single">Single</button>
          </div>
          <div class="option-group">
            <span class="option-label">Input</span>
            <button class="option-btn" data-input="typing">Typing</button>
            <button class="option-btn active" data-input="voice">Voice</button>
          </div>
        </div>
      </div>
      <span class="divider">|</span>
      <!-- 개발자용 -->
      <div class="dev-controls">
        <button id="toggle-dev">Dev</button>
        <div class="dev-options">
          <div class="option-group">
            <span class="option-label">Split</span>
            <button class="option-btn" data-dev="debug-off">OFF</button>
            <button class="option-btn active" data-dev="debug-on">ON</button>
          </div>
          <div class="option-group">
            <span class="option-label">Landmarks</span>
            <button class="option-btn active" data-dev="landmarks-off">OFF</button>
            <button class="option-btn" data-dev="landmarks-on">ON</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>

</html>
